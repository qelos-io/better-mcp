        FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"

  - id: composio
    name: Composio
    description: One MCP endpoint for hundreds of SaaS apps (Gmail, Slack, GitHub, Notion…) with managed auth.
    category: Productivity
    homepage: https://composio.dev
