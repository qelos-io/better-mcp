      args: ["-y", "@modelcontextprotocol/server-everything"]

  - id: exa
    name: Exa
    description: Neural web search, page crawling and research through the Exa API.
    category: Web & search
    homepage: https://github.com/exa-labs/exa-mcp-server
    tags: [search, web, research]
