# better-mcp marketplace registry. Add an entry, run `npm run marketplace:build`,
# and open a PR. See marketplace/README.md for the field reference.
servers:
  - id: filesystem
    name: Filesystem
    description: Read, write and search files under directories you allow.
    category: Files & repos
    homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/filesystem
    tags: [files, local]
    setup: Replace /path/to/allowed/root with the directory to expose.
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/root"]

  - id: git
    name: Git
    description: Read, search and inspect a local Git repository.
    category: Files & repos
    homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/git
    tags: [git, local]
    setup: Requires uv (uvx). Replace /path/to/repo with your repository.
    config:
      command: uvx
      args: ["mcp-server-git", "--repository", "/path/to/repo"]

  - id: github
    name: GitHub
    description: Official GitHub MCP server — repos, issues, pull requests, actions and code search.
    category: Files & repos
    logo: https://cdn.simpleicons.org/github
    homepage: https://github.com/github/github-mcp-server
    tags: [git, issues, pull-requests]
    setup: Set GITHUB_PERSONAL_ACCESS_TOKEN (https://github.com/settings/tokens).
    config:
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"

  - id: github-npm
    name: GitHub (legacy npm)
    description: The original reference GitHub server, run locally through npx.
    category: Files & repos
    logo: https://cdn.simpleicons.org/github
    homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/github
    tags: [git, issues, pull-requests]
    setup: Set GITHUB_PERSONAL_ACCESS_TOKEN (https://github.com/settings/tokens).
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"

  - id: postgres
    name: PostgreSQL
    description: Read-only SQL queries and schema inspection.
    category: Data
    logo: https://cdn.simpleicons.org/postgresql
    homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/postgres
    tags: [database, sql]
    setup: Set DATABASE_URL to your connection string.
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-postgres", "${DATABASE_URL:-postgresql://localhost:5432/mydb}"]

  - id: memory
    name: Memory
    description: Persistent knowledge graph the assistant can read and update.
    category: AI & reasoning
    homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
    tags: [memory, knowledge-graph]
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-memory"]

  - id: sequential-thinking
    name: Sequential Thinking
    description: Structured, revisable step-by-step reasoning.
    category: AI & reasoning
    homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking
    tags: [reasoning]
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]

  - id: fetch
    name: Fetch
    description: Fetch web pages and convert them to markdown for the model.
    category: Web & search
    homepage: https://github.com/modelcontextprotocol/servers/tree/main/src/fetch
    tags: [web, http]
    setup: Requires uv (uvx).
    config:
      command: uvx
      args: ["mcp-server-fetch"]

  - id: brave-search
    name: Brave Search
    description: Web and local search through the Brave Search API.
    category: Web & search
    logo: https://cdn.simpleicons.org/brave
    homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/brave-search
    tags: [search, web]
    setup: Set BRAVE_API_KEY.
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-brave-search"]
      env:
        BRAVE_API_KEY: "${BRAVE_API_KEY}"

  - id: context7
    name: Context7
    description: Up-to-date library documentation and code examples.
    category: Web & search
    homepage: https://context7.com
    tags: [docs, libraries]
    setup: Set CONTEXT7_API_KEY.
    config:
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"

  - id: playwright
    name: Playwright
    description: Browser automation driven by the accessibility tree.
    category: Browser
    homepage: https://github.com/microsoft/playwright-mcp
    tags: [browser, testing]
    setup: Run `npx playwright install` once.
    config:
      command: npx
      args: ["-y", "@playwright/mcp@latest"]

  - id: puppeteer
    name: Puppeteer
    description: Headless Chrome automation and screenshots.
    category: Browser
    logo: https://cdn.simpleicons.org/puppeteer
    homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/puppeteer
    tags: [browser, screenshots]
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-puppeteer"]

  - id: slack
    name: Slack
    description: Read channels and post messages in a Slack workspace.
    category: Productivity
    logo: https://cdn.simpleicons.org/slack
    homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/slack
    tags: [chat, messaging]
    setup: Set SLACK_BOT_TOKEN and SLACK_TEAM_ID.
    config:
      command: npx
      args: ["-y", "@modelcontextprotocol/server-slack"]
      env:
        SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
        SLACK_TEAM_ID: "${SLACK_TEAM_ID}"

  - id: clickup
    name: ClickUp
    description: Search, create and update ClickUp tasks, docs, comments and time entries.
    category: Productivity
    logo: https://cdn.simpleicons.org/clickup
    homepage: https://developer.clickup.com/docs/connect-an-ai-assistant-to-clickups-mcp-server
    tags: [tasks, project-management, oauth]
    setup: Browser login on first run (OAuth).
    config:
      url: https://mcp.clickup.com/mcp

  - id: linear
    name: Linear
    description: Find, create and update Linear issues and projects.
    category: Productivity
