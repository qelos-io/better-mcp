name: Marketplace

on:
  pull_request:
    paths: ["marketplace/**", "src/marketplace/**", "docs/marketplace/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run marketplace:build
      - name: Generated page is up to date
        run: git diff --exit-code docs/marketplace
